
name: Build Last Cast

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      - name: Extract project
        run: unzip -q LastCast-Fabric-1.21.11-Source.zip -d source

      - name: Build mod
        working-directory: source/LastCast-Fabric-1.21.11
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LastCast-JAR
          path: source/LastCast-Fabric-1.21.11/build/libs/*.jar
          if-no-files-found: error
          
